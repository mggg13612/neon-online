<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON STRIKER ONLINE</title><style>*{box-sizing:border-box}body{background:#080e20;color:#d9fcff;font:15px system-ui;margin:0;text-align:center}main{max-width:440px;margin:auto;padding:12px}h1{font-size:24px;color:#76efff}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #42718a;background:#17283e;color:white;margin:4px}canvas{width:100%;max-height:65dvh;object-fit:contain;background:#0b1229;touch-action:none;border:1px solid #345;border-radius:10px}#msg{min-height:24px;color:#ffcc83}#hud{margin:10px}small{color:#9ab4c9}</style><main><h1>NEON STRIKER ONLINE</h1><div id="lobby"><button id="create">방 만들기</button><input id="code" placeholder="6자리 방 코드" maxlength="6" inputmode="numeric"><button id="join">입장</button></div><div id="msg">서버 연결 중...</div><button id="share" hidden>초대 링크 복사</button><div id="hud"></div><canvas id="cv" width="360" height="440"></canvas><button id="restart" hidden>재도전</button><p><small>화면 드래그로 이동 · 자동 발사 · H 아이템으로 팀원 부활</small></p></main><script>
const $=s=>document.getElementById(s),c=$('cv'),x=c.getContext('2d');let id=-1,code='',state=null;const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);function send(m){if(w.readyState===1)w.send(JSON.stringify(m))}w.onopen=()=>{$('msg').textContent='방을 만들거나 입장하세요';$('code').value=new URLSearchParams(location.search).get('room')||''};w.onclose=()=>{$('msg').textContent='연결 종료 · 새로고침 후 다시 입장하세요'};w.onmessage=e=>{let m=JSON.parse(e.data);if(m.error)$('msg').textContent=m.error;if(m.code){code=m.code;id=m.id;$('lobby').hidden=true;$('share').hidden=false}if(m.state){state=m.state;draw()}};$('create').onclick=()=>send({type:'create'});$('join').onclick=()=>send({type:'join',code:$('code').value.trim()});$('restart').onclick=()=>send({type:'restart'});$('share').onclick=async()=>{let url=location.origin+'/?room='+code;try{await navigator.clipboard.writeText(url);$('msg').textContent='초대 링크 복사 완료'}catch{prompt('초대 링크',url)}};
function dot(a,r,color){x.fillStyle=color;x.beginPath();x.arc(a.x,a.y,r,0,7);x.fill()}function ship(p,color){x.fillStyle=color;x.beginPath();x.moveTo(p.x,p.y-19);x.lineTo(p.x-16,p.y+13);x.lineTo(p.x,p.y+6);x.lineTo(p.x+16,p.y+13);x.closePath();x.fill()}
function draw(){let s=state;x.fillStyle='#0b1229';x.fillRect(0,0,360,440);for(let i=0;i<70;i++){x.fillStyle='#6385a3';x.fillRect(i*137%360,i*79%440,1,2)}for(const e of s.en){dot(e,e.boss?39:13,'#d64d85');x.fillStyle='#ffb2cc';x.fillRect(e.x-15,e.y-20,30*e.hp/e.max,3)}for(const b of s.bul){x.fillStyle='#baffff';x.fillRect(b.x-2,b.y-6,4,12)}for(const b of s.shots)dot(b,4,'#ff6489');for(const d of s.drops){dot(d,11,d.type==='H'?'#57bc78':'#d6a344');x.fillStyle='white';x.fillText(d.type,d.x-4,d.y+4)}s.p.forEach((p,i)=>{if(p.hp&&(!p.inv||p.inv%8<4))ship(p,i?'#ffb25d':'#76eaff')});$('hud').textContent='P1 '+ '♥'.repeat(s.p[0].hp)+' | '+s.score+'점 · ST '+s.stage+' | P2 '+'♥'.repeat(s.p[1].hp);$('msg').textContent=s.waiting?'방 코드 '+code+' · 친구 기다리는 중':s.over?'GAME OVER · '+s.score+'점':'방 '+code+' · '+(id===0?'파란색 P1':'주황색 P2');$('restart').hidden=!s.over}
function move(e){if(!state||state.waiting||state.over)return;let r=c.getBoundingClientRect(),scale=Math.min(r.width/360,r.height/440);send({type:'move',x:(e.clientX-r.left-(r.width-360*scale)/2)/scale,y:(e.clientY-r.top-(r.height-440*scale)/2)/scale})}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=e=>{if(c.hasPointerCapture(e.pointerId))move(e)};
</script></html>
